<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seek Collective — Coming Soon</title>
<meta name="description" content="Artisan made unisex lounge wear created transparently and slowly using only natural materials in small batches.">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/hero.jpg">

<meta property="og:type" content="website">
<meta property="og:title" content="Seek Collective — Coming Soon">
<meta property="og:description" content="Artisan made unisex lounge wear created transparently and slowly using only natural materials in small batches.">
<meta property="og:image" content="assets/img/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f8f4f1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@300;400;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="page">

  <!-- ── Hero photograph ───────────────────────────────────────────── -->
  <figure class="hero">
    <img class="hero__img"
         src="assets/img/hero.jpg"
         width="1074" height="1620"
         alt="Black and white photograph of a person resting in bed wrapped in a chunky knit sweater, overlaid with handwriting reading “Seek Collective — to lounge, to relax, to find comfort, to wear, to be…” and “We are resting up and hope you are too…”">
  </figure>

  <!-- ── Content column ────────────────────────────────────────────── -->
  <div class="content">

    <header class="content__head">
      <a class="logo" href="https://seekcollective.com" aria-label="Seek Collective — home">
        <span class="logo__mark" aria-hidden="true">
          <span class="logo__letter logo__letter--s">S</span>
          <span class="logo__letter logo__letter--e1">E</span>
          <span class="logo__letter logo__letter--e2">E</span>
          <span class="logo__letter logo__letter--k">K</span>
        </span>
        <span class="logo__word">Collective</span>
      </a>
    </header>

    <main class="content__main" id="main">
      <h1 class="tagline">
        Artisan made unisex lounge wear created transparently and
        slowly using only natural materials in small batches
      </h1>

      <!--
        Newsletter — mirrors the live seekcollective.com footer signup:
        same Shopify customer endpoint, same hidden fields, same tags.
        Without JS this posts straight to Shopify exactly like the live
        site; assets/js/newsletter.js keeps the visitor on this page.
      -->
      <div class="signup">
        <div class="signup__label">
          <p>Coming soon</p>
          <p><label for="newsletter-email">Find out first by signing up here</label></p>
        </div>

        <form class="signup__form"
              id="footer-newsletter"
              method="post"
              action="https://seekcollective.com/contact#footer-newsletter"
              accept-charset="UTF-8">
          <input type="hidden" name="form_type" value="customer">
          <input type="hidden" name="utf8" value="&#10003;">
          <input type="hidden" name="contact[tags]" value="newsletter">

          <div class="field">
            <input class="field__input"
                   id="newsletter-email"
                   type="email"
                   name="contact[email]"
                   autocomplete="email"
                   spellcheck="false"
                   placeholder="Email address"
                   aria-label="Enter your email address"
                   required>
            <button class="field__submit" type="submit" aria-label="Subscribe">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor"
                      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <p class="signup__status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <footer class="content__foot">
      <nav class="footer-nav" aria-label="Secondary">
        <a href="https://seekcollective.com/pages/consulting">Consulting</a>
        <span class="footer-nav__sep" aria-hidden="true">//</span>
        <a href="https://seekcollective.com/pages/contact">Contact</a>
      </nav>

      <ul class="social" aria-label="Seek Collective on social media">
        <li>
          <a class="social__link" href="https://www.facebook.com/theseekcollective"
             target="_blank" rel="noopener noreferrer">
            <span class="visually-hidden">Facebook</span>
            <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M13.5 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.25-1.5 1.55-1.5h1.65V3.63A22 22 0 0 0 14.3 3.5c-2.38 0-4 1.45-4 4.12V9.9H7.6V13h2.7v8z"/>
            </svg>
          </a>
        </li>
        <li>
          <a class="social__link" href="https://instagram.com/seekcollective"
             target="_blank" rel="noopener noreferrer">
            <span class="visually-hidden">Instagram</span>
            <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="none" stroke="currentColor" stroke-width="1.7" d="M8.2 3.75h7.6a4.45 4.45 0 0 1 4.45 4.45v7.6a4.45 4.45 0 0 1-4.45 4.45H8.2a4.45 4.45 0 0 1-4.45-4.45V8.2A4.45 4.45 0 0 1 8.2 3.75Z"/>
              <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="16.9" cy="7.1" r="1.15" fill="currentColor"/>
            </svg>
          </a>
        </li>
        <li>
          <a class="social__link" href="http://www.pinterest.com/seekcollective/"
             target="_blank" rel="noopener noreferrer">
            <span class="visually-hidden">Pinterest</span>
            <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M12.02 2.5c-5.16 0-7.77 3.62-7.77 6.64 0 1.83.71 3.46 2.23 4.07.25.1.47 0 .54-.27l.22-.85c.07-.27.04-.36-.16-.6-.43-.5-.7-1.16-.7-2.08 0-2.68 2.05-5.08 5.33-5.08 2.9 0 4.5 1.75 4.5 4.08 0 3.07-1.38 5.66-3.43 5.66-1.13 0-1.98-.92-1.7-2.05.32-1.36.95-2.82.95-3.8 0-.88-.48-1.6-1.46-1.6-1.16 0-2.1 1.18-2.1 2.76 0 1 .35 1.68.35 1.68l-1.4 5.86c-.42 1.74-.06 3.87-.03 4.09.02.13.19.16.26.06.11-.14 1.5-1.84 1.97-3.53.13-.48.76-2.94.76-2.94.38.71 1.48 1.33 2.65 1.33 3.49 0 5.86-3.15 5.86-7.37 0-3.19-2.72-6.16-6.87-6.16Z"/>
            </svg>
          </a>
        </li>
        <li>
          <a class="social__link" href="https://www.youtube.com/channel/UC5hRf7MXp9-9KWFUiNHk05Q?disable_polymer=true"
             target="_blank" rel="noopener noreferrer">
            <span class="visually-hidden">YouTube</span>
            <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M21.55 7.9a2.5 2.5 0 0 0-1.76-1.77C18.23 5.7 12 5.7 12 5.7s-6.23 0-7.79.43A2.5 2.5 0 0 0 2.45 7.9C2.03 9.47 2.03 12 2.03 12s0 2.53.42 4.1a2.5 2.5 0 0 0 1.76 1.77c1.56.43 7.79.43 7.79.43s6.23 0 7.79-.43a2.5 2.5 0 0 0 1.76-1.77c.42-1.57.42-4.1.42-4.1s0-2.53-.42-4.1M10.2 15V9l4.94 3z"/>
            </svg>
          </a>
        </li>
      </ul>
    </footer>

  </div>
</div>

<script src="assets/js/newsletter.js" defer></script>
</body>
</html>
